name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: coreprotect-fabric-1.21
            java: '21'
          - project: coreprotect-fabric-1.21.11
            java: '21'
          - project: coreprotect-fabric-26.1.2
            java: '25'
    steps:
      # Actions are pinned to full commit SHAs (a mutable tag can be repointed at any time);
      # the trailing comment records the release the SHA belongs to.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain

      - name: Upload jars
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.project }}-jars
          path: ${{ matrix.project }}/build/libs/*.jar
          # A build that produced no jar must fail, not stay green.
          if-no-files-found: error

  scripts-ascii:
    name: Tool scripts are ASCII-only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Windows PowerShell reads BOM-less .ps1 files as ANSI, so a Chinese literal inside a
      # script silently turns into mojibake (this once corrupted release bodies on GitHub).
      - name: Reject non-ASCII bytes in shell scripts
        run: |
          if grep -rlP '[^\x00-\x7F]' --include='*.ps1' --include='*.sh' --include='*.bat' . ; then
            echo "::error::Non-ASCII text found in a script. Keep scripts pure ASCII and read translated strings from UTF-8 data files."
            exit 1
          fi
          echo "All scripts are ASCII-only."
