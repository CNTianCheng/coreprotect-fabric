version: 2
updates:
  # Keep the three in-sync builds on the same Fabric Loom / Fabric API / sqlite-jdbc versions.
  - package-ecosystem: gradle
    directories:
      - /coreprotect-fabric-1.21
      - /coreprotect-fabric-1.21.11
      - /coreprotect-fabric-26.1.2
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      fabric:
        patterns:
          - "net.fabricmc*"
      sqlite:
        patterns:
          - "org.xerial*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
